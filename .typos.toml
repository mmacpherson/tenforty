[default]
# Preserve the source PDF hash in the verbatim negative-half derivation archive.
extend-ignore-re = [
  "\\b19113ba3\\b",
  # Source-PDF hash prefixes and download path ids in the verbatim b72.12
  # derivation records.
  "\\b[0-9a-f]{7,}\\b",
  "\\b[0-9a-f]{4,}(-[0-9a-f]{4,})+\\b",
  # "mis-read" in the verbatim Minnesota record.
  "\\bmis-read\\b"
]

[default.extend-words]
# "Ded" abbreviates "Deduction" in upstream OpenTaxSolver identifiers such as
# getAZStdDedAmt. typos splits identifiers into words, reads "Ded" as a
# misspelling of "Dead", and rewrites the symbol — silently corrupting quoted
# upstream source.
Ded = "Ded"
# Health savings account; typos would rewrite it to "HAS".
HSA = "HSA"
ND = "ND"
# "OT" ends the upstream OpenTaxSolver identifier charityOT ("other than cash"),
# quoted verbatim in docs/upstream-ots-reports.md.
OT = "OT"
# Colorado form DR 0104PN (part-year resident / nonresident); typos rewrites
# "PN" to "ON", corrupting verbatim derivation records.
PN = "PN"
# "Pease" names the pre-2018 overall limitation on itemized deductions
# (IRC 68), cited in the archived Form 6251 derivations.
Pease = "Pease"
