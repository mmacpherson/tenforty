[default.extend-words]
# "Ded" abbreviates "Deduction" in upstream OpenTaxSolver identifiers such as
# getAZStdDedAmt. typos splits identifiers into words, reads "Ded" as a
# misspelling of "Dead", and rewrites the symbol — silently corrupting quoted
# upstream source.
Ded = "Ded"
# Health savings account; typos would rewrite it to "HAS".
HSA = "HSA"
ND = "ND"
# Colorado form DR 0104PN (part-year resident / nonresident); typos rewrites
# "PN" to "ON", corrupting verbatim derivation records.
PN = "PN"
