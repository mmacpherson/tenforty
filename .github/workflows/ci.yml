name: ci

on:
  push:
    branches: ['**']  # tags run this via release.yml instead
  workflow_call:  # from release.yml, on the tagged commit
  workflow_dispatch:  # also builds the wheels, to test packaging on a branch

permissions:
  contents: read

# Every uv command uses uv.lock as committed, and fails if it is stale
# (except the latest-deps job).
env:
  UV_LOCKED: 1

jobs:
  # Run validation on every push
  validate:
    name: validate (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows excluded due to runtime crashes. See docs/windows-build-research.md
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install deps
      run: uv sync

    - name: Run tests
      run: uv run pytest --hypothesis-profile=ci --require-graph --min-graph-passes=200

  # The jobs above test against uv.lock; this one tests what a new install
  # gets today, the newest versions pyproject.toml allows.
  latest-deps:
    name: validate (ubuntu-latest, 3.14, newest dependencies)
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: '3.14'

    - name: Install the newest deps
      run: uv sync --upgrade

    - name: Run tests
      run: uv run pytest --hypothesis-profile=ci --require-graph --min-graph-passes=200

  # Installs the built wheel (not an editable build) and checks both native
  # backends load from it, on the newest Python, on every platform a wheel
  # ships for, so a new platform is tested on every pull request rather than
  # first at release.
  wheel-install:
    name: installed wheel, Python 3.15 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.15'

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Install test dependencies
      run: uv sync --python python --no-install-project

    - name: Build and install wheel
      run: |
        uv build --wheel --python .venv/bin/python
        uv pip install --no-deps dist/*.whl

    - name: Require both native backends from the installed wheel
      run: |
        uv run --no-sync python - <<'PY'
        import sys
        from pathlib import Path

        import tenforty
        from tenforty.backends import available_backends

        assert sys.version_info[:2] == (3, 15), sys.version
        assert Path(tenforty.__file__).is_relative_to(Path(sys.prefix)), tenforty.__file__
        assert {"ots", "graph"} <= set(available_backends()), available_backends()
        PY

    - name: Run tests against the installed wheel
      run: uv run --no-sync pytest --hypothesis-profile=ci

  # Builds a wheel from the sdist, as any platform without a prebuilt wheel
  # does, in each supported source-build mode: with Rust it must ship the graph
  # backend; without Rust it must fail and say why; with the legacy
  # TENFORTY_WITHOUT_GRAPH=1 opt-out it must build OTS only.
  sdist-install:
    name: install from sdist (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [with-rust, without-rust, without-graph]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: '3.14'
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install Rust toolchain
      if: matrix.mode == 'with-rust'
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Build the sdist
      run: uv build --sdist --out-dir sdist

    - name: Hide the runner's Rust toolchain
      if: matrix.mode != 'with-rust'
      run: |
        set -euo pipefail
        path_without_rust=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -e '\.cargo' -e '\.rustup' | paste -sd:)
        echo "PATH=$path_without_rust" >> "$GITHUB_ENV"

    - name: Build a wheel from the sdist, with Rust
      if: matrix.mode == 'with-rust'
      run: uv build --wheel --out-dir wheel sdist/*.tar.gz

    - name: Build a wheel from the sdist without Rust, which must fail clearly
      if: matrix.mode == 'without-rust'
      run: |
        set -uo pipefail
        if command -v cargo || command -v rustc; then
          echo "::error::the Rust toolchain is still on PATH"
          exit 1
        fi
        if uv build --wheel --out-dir wheel sdist/*.tar.gz > build.log 2>&1; then
          echo "::error::the sdist built without a Rust toolchain"
          exit 1
        fi
        tail -n 40 build.log
        grep -q 'tenforty requires a Rust toolchain to build from source' build.log
        grep -q 'TENFORTY_WITHOUT_GRAPH=1' build.log

    - name: Build a legacy OTS-only wheel from the sdist without Rust
      if: matrix.mode == 'without-graph'
      env:
        TENFORTY_WITHOUT_GRAPH: '1'
      run: |
        set -euo pipefail
        if command -v cargo || command -v rustc; then
          echo "::error::the Rust toolchain is still on PATH"
          exit 1
        fi
        uv build --wheel --out-dir wheel sdist/*.tar.gz

    - name: Install the wheel outside the source tree
      if: matrix.mode != 'without-rust'
      run: |
        uv venv "$RUNNER_TEMP/venv"
        uv pip install --python "$RUNNER_TEMP/venv/bin/python" wheel/*.whl

    - name: Smoke-check the installed graph and OTS backends
      if: matrix.mode == 'with-rust'
      working-directory: ${{ runner.temp }}
      run: '"$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"'

    - name: Check the OTS-only install computes OTS and refuses graph
      if: matrix.mode == 'without-graph'
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/venv/bin/python" - <<'PY'
        import math

        import tenforty
        from tenforty import BackendUnavailableError
        from tenforty.backends import available_backends, get_backend

        assert available_backends() == ["ots"], available_backends()
        result = tenforty.evaluate_return(year=2024, w2_income=75_000, backend="ots")
        assert math.isfinite(result.federal_total_tax) and result.federal_total_tax > 0
        for route in (
            lambda: get_backend("graph"),
            lambda: tenforty.evaluate_return(year=2024, w2_income=75_000, backend="graph"),
            lambda: tenforty.evaluate_return(year=2024, w2_income=75_000, backend="auto"),
        ):
            try:
                route()
            except BackendUnavailableError as error:
                print(f"graph refused: {type(error).__name__}: {error}")
            else:
                raise AssertionError("the OTS-only install routed a return to graph")
        PY

  # The taxcalc adapter conformance tests are gated behind TENFORTY_TAXCALC,
  # which the job above never sets — so without this job they would never run
  # anywhere. That is the same failure they exist to catch: F16 happened
  # because nothing exercised the adapter. Only the conformance file runs here;
  # the full differential sweep takes ~7 minutes and stays opt-in.
  taxcalc-adapter:
    name: taxcalc adapter conformance
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: '3.13'
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Install deps with taxcalc
      run: uv sync --group taxcalc

    - name: Run adapter conformance
      env:
        TENFORTY_TAXCALC: '1'
      run: uv run pytest tests/taxcalc/adapter_conformance_test.py -q

    - name: Verify committed TaxCalc goldens
      run: >-
        uv run python scripts/taxcalc_audit.py
        --check-goldens tests/taxcalc/fixtures/taxcalc_goldens.json

  notebooks:
    name: Colab notebook matches its marimo source
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: '3.13'

    - name: Check the exported .ipynb is current
      run: make notebooks-check

  # The shipped extension is built features=["python"] (setup.py), so the JIT +
  # SIMD batch path — including reachability-slicing in compile_batch — is
  # compiled out of every other job here and of pip installs. Without this job
  # the sliced batch path (the one path where a batch can diverge from
  # single-eval) has no CI coverage at all. Runs the graph crate's jit-gated
  # tests, which include the proper-subset slice-vs-interpreter check.
  graph-jit:
    name: graph backend (JIT + SIMD)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Run graph crate tests with JIT
      run: cargo test -p tenforty-graph --features jit

  # Build wheels and sdist on main, on release tags, and on demand. They don't
  # wait for validation: release.yml publishes only after this whole workflow,
  # validation included, has succeeded.
  build-wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.build }})
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows excluded due to runtime crashes (tenforty-aqx.6.1). See
        # docs/windows-build-research.md.
        # Each runner builds its native architecture: ubuntu-latest x86_64,
        # ubuntu-24.04-arm aarch64, macos-latest arm64, macos-15-intel x86_64.
        # Linux builds one Python at a time in containers, so each version gets
        # its own job; each macOS runner stays one job, since few macOS runners
        # run at once.
        include:
        - {os: ubuntu-latest, build: cp310-*}
        - {os: ubuntu-latest, build: cp311-*}
        - {os: ubuntu-latest, build: cp312-*}
        - {os: ubuntu-latest, build: cp313-*}
        - {os: ubuntu-latest, build: cp314-*}
        - {os: ubuntu-latest, build: cp315-*}
        - {os: ubuntu-24.04-arm, build: cp310-*}
        - {os: ubuntu-24.04-arm, build: cp311-*}
        - {os: ubuntu-24.04-arm, build: cp312-*}
        - {os: ubuntu-24.04-arm, build: cp313-*}
        - {os: ubuntu-24.04-arm, build: cp314-*}
        - {os: ubuntu-24.04-arm, build: cp315-*}
        # rustc's minimum macOS target is 10.12 on x86_64 and 11.0 on arm64;
        # cibuildwheel defaults x86_64 to 10.9, which delocate then rejects.
        - {os: macos-latest, build: cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*, macos_target: '11.0'}
        - {os: macos-15-intel, build: cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*, macos_target: '10.12'}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
      env:
        CIBW_BUILD: ${{ matrix.build }}
        CIBW_BEFORE_BUILD: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && pip install setuptools-rust>=1.7
        CIBW_ENVIRONMENT: PATH="$HOME/.cargo/bin:$PATH"
        CIBW_ENVIRONMENT_MACOS: PATH="$HOME/.cargo/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}
        # Every shipped wheel must load and evaluate both backends.
        CIBW_TEST_COMMAND: python {project}/scripts/smoke_installed.py

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Build sdist
      run: pipx run build --sdist

    - name: Check the metadata PyPI will render
      run: pipx run twine check --strict dist/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz
