name: Update Pre-commit Hooks

on:
  schedule:
    # Run every Sunday at 11:00 AM UTC (4:00 AM Pacific)
  - cron: 0 11 * * 0
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Update pre-commit hooks
      run: |
        # Store original config for comparison
        cp .pre-commit-config.yaml .pre-commit-config.yaml.bak

        # Save typos rev before update (pinned — moving v1 tag reverts semver pin)
        TYPOS_REV=$(awk '/crate-ci\/typos/{getline; print $2}' .pre-commit-config.yaml)

        uv sync
        uv run pre-commit autoupdate

        # Restore pinned typos rev
        sed -i "/crate-ci\/typos/{n;s/rev: .*/rev: $TYPOS_REV/}" .pre-commit-config.yaml

        # Check if there are any changes
        if ! diff -q .pre-commit-config.yaml .pre-commit-config.yaml.bak > /dev/null; then
          echo "HOOKS_UPDATED=true" >> "$GITHUB_ENV"
          echo "Pre-commit hooks have been updated"
        else
          echo "HOOKS_UPDATED=false" >> "$GITHUB_ENV"
          echo "No pre-commit hook updates available"
        fi

    - name: Update pinned hook dependencies
      # `pre-commit autoupdate` bumps each hook's rev but never its
      # additional_dependencies; move exact pins there (name==version, in
      # inline lists) to the latest release on PyPI.
      run: |
        cp .pre-commit-config.yaml .pre-commit-config.yaml.pins
        python3 - <<'PY'
        import json
        import re
        import urllib.request

        def latest(name):
            with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json") as r:
                return json.load(r)["info"]["version"]

        def bump(match):
            name, old = match.groups()
            new = latest(name)
            if new != old:
                print(f"{name}: {old} -> {new}")
            return f"{name}=={new}"

        path = ".pre-commit-config.yaml"
        lines = open(path).read().splitlines(keepends=True)
        pin = re.compile(r"([A-Za-z0-9][A-Za-z0-9._-]*)==([A-Za-z0-9.+!-]+)")
        lines = [
            pin.sub(bump, line) if "additional_dependencies" in line else line
            for line in lines
        ]
        open(path, "w").write("".join(lines))
        PY
        if ! diff -q .pre-commit-config.yaml .pre-commit-config.yaml.pins > /dev/null; then
          echo "HOOKS_UPDATED=true" >> "$GITHUB_ENV"
        fi
        rm .pre-commit-config.yaml.pins

    - name: Validate hook updates
      if: env.HOOKS_UPDATED == 'true'
      env:
        # Skip Rust hooks — no toolchain in CI (enforced by dedicated CI jobs)
        SKIP: cargo-clippy,cargo-fmt
      run: |
        echo "Running pre-commit hooks to validate updates..."

        # First run - often fails but makes auto-fixes
        if make run-hooks-all-files; then
          echo "HOOKS_VALID=true" >> "$GITHUB_ENV"
          echo "All pre-commit hooks passed validation on first run"
        else
          echo "Pre-commit hooks failed on first run (expected - likely auto-fixing)"

          # Stage the pre-commit config
          git add .pre-commit-config.yaml

          # Second run - should pass after auto-fixes
          if make run-hooks-all-files; then
            echo "HOOKS_VALID=true" >> "$GITHUB_ENV"
            echo "All pre-commit hooks passed validation on second run"
          else
            echo "HOOKS_VALID=false" >> "$GITHUB_ENV"
            echo "Pre-commit hooks failed validation - manual intervention required"
          fi
        fi

    - name: Mint the CI bot's token
      # Pushes and PRs made with the built-in token don't trigger workflows, so
      # the PR would get no CI; ones made with this GitHub App's token do.
      # Minted just before use: App tokens last an hour.
      if: env.HOOKS_UPDATED == 'true' && env.HOOKS_VALID == 'true'
      id: bot
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
      with:
        client-id: ${{ vars.CI_BOT_CLIENT_ID }}
        private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

    - name: Create Pull Request
      if: env.HOOKS_UPDATED == 'true' && env.HOOKS_VALID == 'true'
      run: |
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Create a new branch
        BRANCH_NAME="chore/update-precommit-hooks-$(date +%Y%m%d)"
        git checkout -b "$BRANCH_NAME"

        # Stage the config, and any files the validated hooks reformatted
        git add -u

        # Commit the changes
        git commit -m "$(cat <<'EOF'
        chore: update pre-commit hooks to latest versions

        🤖 Generated with GitHub Actions
        EOF
        )"

        # Push the branch
        git push "https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH_NAME"

        # Create PR using gh CLI
        gh pr create \
          --title "chore: update pre-commit hooks to latest versions" \
          --body "$(cat <<'EOF'
        ## Summary
        Weekly automated update of pre-commit hooks to their latest versions.

        ## Changes
        - Updated pre-commit hook versions in `.pre-commit-config.yaml`

        ## Test plan
        - [ ] Verify hooks pass locally: `make run-hooks-all-files`
        EOF
        )"
      env:
        GH_TOKEN: ${{ steps.bot.outputs.token }}
        BOT_TOKEN: ${{ steps.bot.outputs.token }}

    - name: Summary
      if: always()
      run: |
        {
          echo "## Pre-commit Hook Update Summary"
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "- **Hooks Updated**: ${{ env.HOOKS_UPDATED }}"

          if [ "${{ env.HOOKS_UPDATED }}" = "true" ]; then
            echo "- **Hooks Valid**: ${{ env.HOOKS_VALID }}"
            if [ "${{ env.HOOKS_VALID }}" = "true" ]; then
              echo "- **Status**: PR created with hook updates"
            else
              echo "- **Status**: Hook updates failed validation"
            fi
          else
            echo "- **Status**: All hooks already up to date"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Clean up
      if: always()
      run: rm -f .pre-commit-config.yaml.bak

    - name: Open issue on failure
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        title="CI failure: ${{ github.workflow }}"
        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        existing=$(gh issue list --repo "${{ github.repository }}" --label ci-failure --state open \
          --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --repo "${{ github.repository }}" --body "Still failing: $run_url"
        else
          gh issue create --repo "${{ github.repository }}" --label ci-failure --title "$title" \
            --body "Automated housekeeping workflow failed. Latest run: $run_url

        Surfaced by the /prs weekly review. Close when the workflow is green again."
        fi
