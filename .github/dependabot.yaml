# Set update schedule for GitHub Actions

version: 2
updates:

- package-ecosystem: github-actions
  directory: /
  schedule:
      # Check for updates to GitHub Actions every week
    interval: weekly

  # Maintain uv.lock
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  groups:
    uv-lock:
      patterns: ['*']
