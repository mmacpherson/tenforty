ci:
  skip: [cargo-fmt]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [--maxkb=2000]
    exclude: ^ots/ots-releases/
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: debug-statements
  - id: detect-aws-credentials
    args: [--allow-missing-credentials]
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: name-tests-test
    args: [--pytest]
    exclude: ^tests/(fixtures/|taxcalc/(taxcalc_policy|__init__)\.py|parity/state_parity_policy\.py)
  - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.2
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format
    # ruff-pre-commit 0.17 formats Markdown code blocks too; ours include
    # printed output and verbatim quotes of upstream source, so keep it to code.
    types_or: [python, pyi, jupyter]
- repo: https://github.com/crate-ci/typos
  rev: v1.51.1
  hooks:
  - id: typos
    files: \.(md|txt)$
    exclude: ^(tests/fixtures/|CHANGELOG\.md$)
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --indent, '2']
    # Pin the formatter: an unpinned one varies with when each machine's hook
    # environment was built (toml-sort 0.24 and 0.25 space inline tables
    # differently). The weekly update-pre-commit-hooks workflow bumps this pin.
    additional_dependencies: [toml-sort==0.25.0]
    # Lockfiles are machine-written; reformatting them only makes churn.
    exclude: ^(Cargo|uv)\.lock$
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
  hooks:
  - id: prettier
    files: ^crates/tenforty-graph/demo/.*\.(css|html|js|json)$
- repo: local
  hooks:
  - id: ormolu
    name: ormolu (haskell format check)
    language: system
    entry: ormolu --mode check
    files: ^tenforty-spec/.*\.hs$
  - id: cabal-gild
    name: cabal-gild (.cabal format check)
    language: system
    entry: cabal-gild --mode check
    files: ^tenforty-spec/.*\.cabal$
  - id: cargo-fmt
    name: cargo fmt
    language: system
    entry: cargo fmt --all
    pass_filenames: false
    files: \.rs$
  - id: cargo-clippy
    name: cargo clippy
    language: system
    entry: cargo clippy --workspace --all-targets -- -D warnings
    pass_filenames: false
    stages: [manual]
    files: \.rs$
